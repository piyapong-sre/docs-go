services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
      POSTGRES_DB: tasks
    ports:
      - "${DB_HOST_PORT:-5433}:5432" # change DB_HOST_PORT if 5433 is taken
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: postgres://tasks:tasks@db:5432/tasks?sslmode=disable
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Longer than SHUTDOWN_TIMEOUT (15s) so in-flight requests can finish
    # before Docker sends SIGKILL (default grace period is only 10s).
    stop_grace_period: 20s

volumes:
  pgdata:
